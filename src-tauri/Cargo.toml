[package]
name = "urofarmacos"
version = "1.0.0"
description = "UroFármacos - wiki de fármacos en urología, app de escritorio"
authors = ["Rey"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
